<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Zen Sanctuary</title>

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #ffffff;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    /* Fixed Background Layer with Gradient Base */
    #bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: radial-gradient(circle at 50% 40%, #1e293b 0%, #090d16 100%);
      filter: brightness(0.65);
      transition: background-image 0.8s ease-in-out;
      z-index: 1;
    }

    /* Custom WCO Title Bar */
    .custom-titlebar {
      display: none;
      /* Hidden by default in standard browser tabs */
      position: fixed;
      top: env(titlebar-area-y, 0);
      left: env(titlebar-area-x, 0);
      width: env(titlebar-area-width, 100%);
      height: env(titlebar-area-height, 36px);
      z-index: 999;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      align-items: center;
      padding: 0 14px;
      app-region: drag;
      /* Makes the title bar draggable */
      -webkit-app-region: drag;
    }

    .custom-titlebar .app-title {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
    }

    /* Activate title bar and offset controls when WCO is active */
    @media (display-mode: window-controls-overlay) {
      .custom-titlebar {
        display: flex;
      }

      /* Shift weather badge down to avoid collision with top title bar area */
      .weather-badge {
        top: calc(env(titlebar-area-height, 36px) + 12px) !important;
      }
    }

    /* Layout Container */
    .container {
      position: relative;
      z-index: 2;
      display: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      padding: clamp(16px, 4vw, 32px);
      padding-top: calc(clamp(16px, 4vw, 32px) + env(safe-area-inset-top));
      padding-bottom: calc(clamp(70px, 12vw, 96px) + env(safe-area-inset-bottom));
      padding-left: calc(clamp(16px, 4vw, 32px) + env(safe-area-inset-left));
      padding-right: calc(clamp(16px, 4vw, 32px) + env(safe-area-inset-right));
    }

    /* Glassmorphism Quote Card */
    .quote-card {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: clamp(18px, 4vw, 28px);
      padding: clamp(24px, 6vw, 48px) clamp(20px, 5vw, 40px);
      width: 100%;
      max-width: 680px;
      max-height: 75dvh;
      overflow-y: auto;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      scrollbar-width: none;
      transition: opacity 0.4s ease;
    }

    .quote-card::-webkit-scrollbar {
      display: none;
    }

    .quote-mark {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      line-height: 1;
      opacity: 0.45;
      margin-bottom: 8px;
    }

    .quote-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.15rem, 3.8vw, 1.8rem);
      line-height: 1.55;
      letter-spacing: 0.3px;
      margin-bottom: clamp(16px, 4vw, 24px);
      color: #f8fafc;
      word-wrap: break-word;
    }

    .quote-author {
      font-size: clamp(0.78rem, 2.2vw, 0.95rem);
      font-weight: 300;
      letter-spacing: clamp(1.5px, 0.5vw, 2.5px);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
    }

    /* Floating UI Controls */
    .controls {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right));
      left: calc(16px + env(safe-area-inset-left));
      z-index: 3;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .track-badge {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 8px 16px;
      font-size: clamp(0.72rem, 2vw, 0.82rem);
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100vw - 110px);
      pointer-events: auto;
    }

    .btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
      pointer-events: auto;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      pointer-events: none;
    }

    /* Weather Badge in Top-Right */
    .weather-badge {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 3;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(0.75rem, 2.2vw, 0.85rem);
      color: #f8fafc;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      pointer-events: auto;
      transition: opacity 0.3s ease;
    }

    .weather-icon {
      font-size: 1.1rem;
      line-height: 1;
    }

    .weather-temp {
      font-weight: 600;
      font-family: 'Cinzel', serif;
    }

    .weather-desc {
      opacity: 0.8;
      font-weight: 300;
    }

    .weather-location {
      font-weight: 400;
      color: #f8fafc;
    }

    .weather-divider {
      opacity: 0.4;
      font-size: 0.75rem;
    }

    /* Hide full condition text on very small screens to keep it compact */
    @media (max-width: 480px) {
      .weather-desc {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header id="custom-titlebar" class="custom-titlebar">
    <div class="app-title">Zen Sanctuary</div>
  </header>

  <div id="bg-layer"></div>

  <aside class="weather-badge" id="weather-badge" aria-label="Current Weather">
    <span class="weather-icon" id="weather-icon">✨</span>
    <span class="weather-location" id="weather-location">Detecting...</span>
    <span class="weather-divider">•</span>
    <span class="weather-temp" id="weather-temp">--°</span>
    <span class="weather-desc" id="weather-desc"></span>
  </aside>

  <main class="container">
    <article class="quote-card" id="quote-card">
      <div class="quote-mark">“</div>
      <p class="quote-text" id="quote-text">Loading tranquility...</p>
      <p class="quote-author" id="quote-author"></p>
    </article>
  </main>

  <nav class="controls">
    <div class="track-badge" id="track-badge">Playing Audio</div>
    <button class="btn" id="audio-toggle" title="Play/Pause Music" aria-label="Toggle Audio">
      <svg id="audio-icon" viewBox="0 0 24 24">
        <path
          d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
      </svg>
    </button>
    <button class="btn" id="share-btn" title="Share Quote" aria-label="Share Quote">
      <svg viewBox="0 0 24 24">
        <path
          d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z" />
      </svg>
    </button>
  </nav>

  <audio id="ambient-audio" preload="auto" playsinline webkit-playsinline></audio>

  <script>
    // --- 1. Storage & State Management ---
    const memory = {};
    function getHistory(key) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : (memory[key] || []);
      } catch (e) {
        return memory[key] || [];
      }
    }
    function saveHistory(key, item, max = 50) {
      try {
        let list = getHistory(key);
        if (!list.includes(item)) {
          list.push(item);
          if (list.length > max) list.shift();
          localStorage.setItem(key, JSON.stringify(list));
          memory[key] = list;
        }
      } catch (e) {
        let list = memory[key] || [];
        if (!list.includes(item)) {
          list.push(item);
          if (list.length > max) list.shift();
          memory[key] = list;
        }
      }
    }

    // --- 2. Dynamic Creative Commons Backgrounds (Zero-Auth) ---
    async function loadBackground() {
      const bgLayer = document.getElementById('bg-layer');

      // Calming nature search terms
      const searchQueries = [
        'Category:Mist_in_forests',
        'Category:Mountain_lakes',
        'Category:Zen_gardens',
        'Category:Sunsets_over_water',
        'Category:Japanese_gardens'
      ];
      const query = searchQueries[Math.floor(Math.random() * searchQueries.length)];

      try {
        // Queries Wikimedia Commons for high-res landscape images in the selected category
        const endpoint = `https://commons.wikimedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=${encodeURIComponent(query)}&gcmtype=file&gcmlimit=25&prop=imageinfo&iiprop=url|mime&format=json&origin=*`;

        const res = await fetch(endpoint);
        if (!res.ok) throw new Error('Wikimedia API error');

        const data = await res.json();
        const pages = Object.values(data.query.pages || {});

        // Filter only JPEG/PNG images (excluding SVGs and audio)
        const validImages = pages
          .filter(p => p.imageinfo && p.imageinfo[0] && (p.imageinfo[0].mime === 'image/jpeg' || p.imageinfo[0].mime === 'image/png'))
          .map(p => p.imageinfo[0].url);

        if (validImages.length === 0) throw new Error('No images found');

        const chosenUrl = validImages[Math.floor(Math.random() * validImages.length)];

        // Preload image before applying to avoid blank flickers
        const img = new Image();
        img.src = chosenUrl;
        img.onload = () => {
          bgLayer.style.backgroundImage = `url('${chosenUrl}')`;
        };
      } catch (err) {
        // Safe fallback to high-res nature background if network drops
        bgLayer.style.backgroundImage = "url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80')";
      }
    }

    // --- 3. Dynamic External Quotes API Fetcher ---
    async function loadQuote() {
      const quoteText = document.getElementById('quote-text');
      const quoteAuthor = document.getElementById('quote-author');

      try {
        // Primary Source: Quotable API (Inspirational/Wisdom tags)
        const res = await fetch('https://api.quotable.io/random?tags=inspirational|wisdom|peace');
        if (!res.ok) throw new Error('Primary quote endpoint failed');
        const data = await res.json();
        quoteText.textContent = data.content;
        quoteAuthor.textContent = `— ${data.author || 'Unknown'}`;
      } catch (err) {
        try {
          // Secondary Backup Source: DummyJSON Quotes API
          const resBackup = await fetch('https://dummyjson.com/quotes/random');
          if (!resBackup.ok) throw new Error('Backup quote endpoint failed');
          const dataBackup = await resBackup.json();
          quoteText.textContent = dataBackup.quote;
          quoteAuthor.textContent = `— ${dataBackup.author || 'Unknown'}`;
        } catch (fallbackErr) {
          // Offline fallback
          const fallbackQuotes = [
            { quote: "Silence is the source of great strength.", author: "Lao Tzu" },
            { quote: "In the midst of movement and chaos, keep stillness inside of you.", author: "Deepak Chopra" },
            { quote: "Peace comes from within. Do not seek it without.", author: "Buddha" },
            { quote: "Adopt the pace of nature: her secret is patience.", author: "Ralph Waldo Emerson" }
          ];
          const chosen = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
          quoteText.textContent = chosen.quote;
          quoteAuthor.textContent = `— ${chosen.author}`;
        }
      }
    }

    // --- 4. Dynamic Creative Commons Music (Jamendo API) ---
    let trackQueue = [];
    let currentTrackIndex = -1;

    async function fetchTracks() {
      const CLIENT_ID = '6cc82698';
      const tags = ['ambient', 'meditation', 'relaxation', 'nature'];
      const randomTag = tags[Math.floor(Math.random() * tags.length)];
      const endpoint = `https://api.jamendo.com/v3.0/tracks/?client_id=${CLIENT_ID}&format=jsonpretty&limit=30&tags=${randomTag}&audioformat=mp32&featured=1&order=releasedate_desc`;

      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error('Network response not ok');
        const data = await res.json();
        return data.results && data.results.length > 0 ? data.results : null;
      } catch (err) {
        return null;
      }
    }

    async function playNextTrack() {
      const audio = document.getElementById('ambient-audio');
      const trackBadge = document.getElementById('track-badge');
      const audioBtn = document.getElementById('audio-toggle');

      if (trackQueue.length === 0) {
        trackBadge.textContent = 'Discovering music...';
        trackQueue = await fetchTracks();
      }

      if (trackQueue && trackQueue.length > 0) {
        // Pick a different track from the queue
        let nextIndex;
        do {
          nextIndex = Math.floor(Math.random() * trackQueue.length);
        } while (trackQueue.length > 1 && nextIndex === currentTrackIndex);

        currentTrackIndex = nextIndex;
        const track = trackQueue[currentTrackIndex];

        audio.src = track.audio;
        audio.volume = 0.55;
        trackBadge.textContent = `${track.name} — ${track.artist_name}`;

        audio.play().then(() => {
          audioBtn.style.opacity = '1';
        }).catch(() => {
          audioBtn.style.opacity = '0.5';
        });
      } else {
        // Fallback if API fails
        audio.src = "https://actions.google.com/sounds/v1/water/small_stream_flowing.ogg";
        audio.volume = 0.55;
        trackBadge.textContent = "Forest Brook (Ambient)";
        audio.play().catch(() => { });
      }
    }

    function setupMusic() {
      const audio = document.getElementById('ambient-audio');
      const audioBtn = document.getElementById('audio-toggle');

      // Trigger next song automatically when current one finishes
      audio.addEventListener('ended', () => {
        playNextTrack();
      });

      // Toggle Play / Pause
      const handleToggle = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (audio.paused) {
          audio.muted = false;
          audio.play().then(() => {
            audioBtn.style.opacity = '1';
          }).catch(() => { });
        } else {
          audio.pause();
          audioBtn.style.opacity = '0.4';
        }
      };

      audioBtn.addEventListener('click', handleToggle);
      audioBtn.addEventListener('touchend', handleToggle);

      // Initial user interaction unlocker
      const unlockAudio = () => {
        if (audio.paused) {
          audio.muted = false;
          audio.play().then(() => {
            audioBtn.style.opacity = '1';
          }).catch(() => { });
        }
        ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt =>
          window.removeEventListener(evt, unlockAudio)
        );
      };

      ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt =>
        window.addEventListener(evt, unlockAudio, { passive: true, once: true })
      );

      // Load the first track
      playNextTrack();
    }

    function setupShare() {
      const shareBtn = document.getElementById('share-btn');
      const trackBadge = document.getElementById('track-badge');

      shareBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();

        const quoteText = document.getElementById('quote-text').textContent;
        const quoteAuthor = document.getElementById('quote-author').textContent;
        const shareData = {
          title: 'Zen Sanctuary',
          text: `“${quoteText}” ${quoteAuthor}`,
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
          } catch (err) {
            // User canceled share; no action needed
          }
        } else {
          // Fallback: Copy to clipboard and show badge feedback
          try {
            await navigator.clipboard.writeText(`“${quoteText}” ${quoteAuthor}`);
            const originalText = trackBadge.textContent;
            trackBadge.textContent = 'Quote copied to clipboard!';
            setTimeout(() => {
              trackBadge.textContent = originalText;
            }, 2500);
          } catch (err) {
            alert('Could not copy quote.');
          }
        }
      });
    }

    // --- 5. Open-Meteo Current Location Weather ---
    const WMO_CODES = {
      0: { label: "Clear Sky", icon: "☀️" },
      1: { label: "Mainly Clear", icon: "🌤️" },
      2: { label: "Partly Cloudy", icon: "⛅" },
      3: { label: "Overcast", icon: "☁️" },
      45: { label: "Foggy", icon: "🌫️" },
      48: { label: "Rime Fog", icon: "🌫️" },
      51: { label: "Light Drizzle", icon: "🌦️" },
      53: { label: "Drizzle", icon: "🌦️" },
      55: { label: "Heavy Drizzle", icon: "🌧️" },
      61: { label: "Light Rain", icon: "🌧️" },
      63: { label: "Moderate Rain", icon: "🌧️" },
      65: { label: "Heavy Rain", icon: "🌧️" },
      71: { label: "Light Snow", icon: "🌨️" },
      73: { label: "Snow", icon: "🌨️" },
      75: { label: "Heavy Snow", icon: "❄️" },
      80: { label: "Rain Showers", icon: "🌦️" },
      95: { label: "Thunderstorm", icon: "⛈️" }
    };

    async function fetchWeather(lat, lon) {
      const endpoint = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;

      const res = await fetch(endpoint);
      if (!res.ok) throw new Error("Weather service unreachable");
      return await res.json();
    }

    // --- Reverse Geocoding Helper ---
    async function fetchCityName(lat, lon) {
      try {
        const endpoint = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`;
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("Geocoding failed");
        const data = await res.json();

        // Returns "City, Country" or "Locality, Country"
        const city = data.city || data.locality || data.principalSubdivision || "Nearby";
        const country = data.countryCode || "";
        return country ? `${city}, ${country}` : city;
      } catch (e) {
        return "Your Sanctuary";
      }
    }

    // --- Weather UI Updater ---
    function updateWeatherUI(cityName, temp, code) {
      const iconElem = document.getElementById('weather-icon');
      const locationElem = document.getElementById('weather-location');
      const tempElem = document.getElementById('weather-temp');
      const descElem = document.getElementById('weather-desc');

      const meta = WMO_CODES[code] || { label: "Calm", icon: "🌤️" };

      locationElem.textContent = cityName;
      iconElem.textContent = meta.icon;
      tempElem.textContent = `${Math.round(temp)}°C`;
      descElem.textContent = `(${meta.label})`;
    }

    // --- Main Loader ---
    function loadWeather() {
      const locationElem = document.getElementById('weather-location');

      if (!navigator.geolocation) {
        locationElem.textContent = "Location unavailable";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          try {
            const { latitude, longitude } = position.coords;

            // Fetch weather and city name in parallel for speed
            const [weatherData, cityName] = await Promise.all([
              fetchWeather(latitude, longitude),
              fetchCityName(latitude, longitude)
            ]);

            const current = weatherData.current;
            updateWeatherUI(cityName, current.temperature_2m, current.weather_code);
          } catch (err) {
            locationElem.textContent = "Weather offline";
          }
        },
        (err) => {
          locationElem.textContent = "Location disabled";
        },
        { timeout: 8000, enableHighAccuracy: false }
      );
    }

    // --- 6. Window Controls Overlay (WCO) Handler ---
    function setupWindowControlsOverlay() {
      if ('windowControlsOverlay' in navigator) {
        const titlebar = document.getElementById('custom-titlebar');

        // Initial check when page opens
        if (titlebar) {
          titlebar.style.display = navigator.windowControlsOverlay.visible ? 'flex' : 'none';
        }

        // React dynamically if the user toggles the title bar button in desktop PWA
        navigator.windowControlsOverlay.addEventListener('geometrychange', () => {
          const isOverlayVisible = navigator.windowControlsOverlay.visible;
          if (titlebar) {
            titlebar.style.display = isOverlayVisible ? 'flex' : 'none';
          }
        });
      }
    }

    loadWeather();
    loadBackground();
    loadQuote();
    setupMusic();

    // Call inside your initial load sequence
    setupShare();

    setupWindowControlsOverlay();
